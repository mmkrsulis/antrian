name: queue-management-live

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${QUEUE_BIND_IP:?Set QUEUE_BIND_IP in your private environment}:${QUEUE_PORT:-8090}:80"
      - "${QUEUE_LAN_IP:?Set QUEUE_LAN_IP in your private environment}:${QUEUE_PORT:-8090}:80"
    env_file: .env.live
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.live
    entrypoint: ["/bin/sh", "-c", "export MARIADB_DATABASE=\"$$DB_DATABASE\" MARIADB_USER=\"$$DB_USERNAME\" MARIADB_PASSWORD=\"$$DB_PASSWORD\" MARIADB_RANDOM_ROOT_PASSWORD=1; exec docker-entrypoint.sh mariadbd"]
    volumes:
      - queue_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  queue_db_data:
