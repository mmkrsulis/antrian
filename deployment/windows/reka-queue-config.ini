[client]
# Use the reachable server address without a trailing slash.
# Examples:
# SERVER_URL=http://server-address:8090
# SERVER_URL=https://queue.example.go.id
SERVER_URL=http://server-address:8090

# Display access key configured on the server.
DISPLAY_KEY=change-this-display-key

# Horizontal position of monitor 2. Use -1920 when it is left of monitor 1.
MONITOR_X=1920

# Register the Operator/Display EXE for the current Windows user at startup.
AUTO_START=1
